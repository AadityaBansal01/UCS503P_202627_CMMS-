site_name: "CMMS · College Mentorship Management System"
site_description: "Engineering documentation and architecture for the College Mentorship Management System (UCS503P, TIET Patiala)"
site_author: "Aaditya Bansal, Jessica, Harshveer Singh"
site_url: https://aadityabansal01.github.io/UCS503P_202627_CMMS-/

repo_url: https://github.com/AadityaBansal01/UCS503P_202627_CMMS-
repo_name: AadityaBansal01/UCS503P_202627_CMMS-
copyright: "Copyright &copy; 2026 Aaditya Bansal, Jessica, Harshveer Singh · UCS503P Software Engineering, TIET Patiala"

theme:
  name: material
  custom_dir: assets/theme-overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.tooltips
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/tiet-logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - literate-nav:
      nav_file: summary.md
  - section-index
  - git-revision-date-localized
  - git-authors

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AadityaBansal01/UCS503P_202627_CMMS-
      name: GitHub Repository
    - icon: fontawesome/solid/graduation-cap
      link: https://www.thapar.edu/
      name: Thapar Institute of Engineering and Technology

extra_css:
  - assets/stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - javascript/arithmatex.js

markdown_extensions:
  - abbr
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 3
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite:
      custom_inline:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_inline_format {which: generic}
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: math
          class: arithmatex
          arithmatex: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {which: generic}
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - sane_lists

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CMMS DFD Level 2 - Process 1.0 Allocation</title>
<desc>Sub-processes 1.1 to 1.5 exploding mentor allocation, with entities Student and Department Admin and stores D1 Users and D2 Assignments.</desc>
<rect width="680" height="540" fill="#FFFFFF"/>
<style>
text{font-family:Helvetica,Arial,sans-serif}
.t{font-size:14px}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#444441;stroke-width:1.2;fill:none}
.ent rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.ent text{fill:#2C2C2A}
.proc rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.proc .th{fill:#3C3489}
.proc .ts{fill:#534AB7}
.alt rect{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.alt .th{fill:#712B13}
.alt .ts{fill:#993C1D}
.store rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.store text{fill:#085041}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="ent"><rect x="40" y="66" width="130" height="44" rx="4"/><text class="th" x="105" y="88" text-anchor="middle" dominant-baseline="central">Student</text></g>
<g class="ent"><rect x="40" y="336" width="130" height="44" rx="4"/><text class="th" x="105" y="358" text-anchor="middle" dominant-baseline="central">Student, faculty</text></g>
<g class="ent"><rect x="40" y="446" width="130" height="44" rx="4"/><text class="th" x="105" y="468" text-anchor="middle" dominant-baseline="central">Dept admin</text></g>

<g class="proc"><rect x="250" y="60" width="180" height="56" rx="28"/><text class="th" x="340" y="80" text-anchor="middle" dominant-baseline="central">1.1 Validate request</text><text class="ts" x="340" y="98" text-anchor="middle" dominant-baseline="central">Check eligibility, duplicates</text></g>
<g class="proc"><rect x="250" y="150" width="180" height="56" rx="28"/><text class="th" x="340" y="170" text-anchor="middle" dominant-baseline="central">1.2 Match mentor</text><text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">Dept, load, preference</text></g>
<g class="proc"><rect x="250" y="240" width="180" height="56" rx="28"/><text class="th" x="340" y="260" text-anchor="middle" dominant-baseline="central">1.3 Create assignment</text><text class="ts" x="340" y="278" text-anchor="middle" dominant-baseline="central">Persist pairing record</text></g>
<g class="proc"><rect x="250" y="330" width="180" height="56" rx="28"/><text class="th" x="340" y="350" text-anchor="middle" dominant-baseline="central">1.4 Notify parties</text><text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">Confirmation, mentee list</text></g>
<g class="alt"><rect x="250" y="440" width="180" height="56" rx="28"/><text class="th" x="340" y="460" text-anchor="middle" dominant-baseline="central">1.5 Reassign mentor</text><text class="ts" x="340" y="478" text-anchor="middle" dominant-baseline="central">Close old, open new</text></g>

<g class="store"><rect x="490" y="156" width="150" height="44" rx="2"/><text class="th" x="565" y="178" text-anchor="middle" dominant-baseline="central">D1 Users</text></g>
<g class="store"><rect x="490" y="246" width="150" height="44" rx="2"/><text class="th" x="565" y="268" text-anchor="middle" dominant-baseline="central">D2 Assignments</text></g>

<line x1="170" y1="88" x2="242" y2="88" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="206" y="76" text-anchor="middle">mentor request</text>
<line x1="340" y1="116" x2="340" y2="142" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="132">valid request</text>
<line x1="340" y1="206" x2="340" y2="232" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="222">chosen mentor</text>
<line x1="340" y1="296" x2="340" y2="322" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="312">pairing id</text>
<line x1="242" y1="358" x2="178" y2="358" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="346" text-anchor="middle">confirmation</text>
<line x1="170" y1="468" x2="242" y2="468" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="206" y="456" text-anchor="middle">reassign command</text>

<line x1="430" y1="178" x2="482" y2="178" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="456" y="166" text-anchor="middle">read profile</text>
<line x1="430" y1="268" x2="482" y2="268" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="456" y="256" text-anchor="middle">write</text>
<path d="M430 452 L565 452 L565 298" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="500" y="442" text-anchor="middle">update pairing</text>
<path d="M482 192 L460 210 L460 356 L430 356" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="466" y="404">contact details</text>
</svg>

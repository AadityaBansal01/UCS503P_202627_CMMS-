<svg viewBox="0 0 1400 1150" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E2761"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="1150" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E2761">CMMS Activity Diagram — Mentor Booking &amp; Meeting Workflow</text>

  <!-- Swimlane backgrounds -->
  <rect x="0" y="70" width="466" height="1050" fill="#EAF4FD"/>
  <rect x="466" y="70" width="467" height="1050" fill="#E9F9F5"/>
  <rect x="933" y="70" width="467" height="1050" fill="#F3EEFC"/>

  <!-- Lane dividers -->
  <line x1="466" y1="70" x2="466" y2="1120" stroke="#C7CEDD" stroke-width="1.5"/>
  <line x1="933" y1="70" x2="933" y2="1120" stroke="#C7CEDD" stroke-width="1.5"/>

  <!-- Lane headers -->
  <rect x="0" y="70" width="466" height="46" fill="#0EA5E9"/>
  <text x="233" y="99" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">STUDENT</text>

  <rect x="466" y="70" width="467" height="46" fill="#14B8A6"/>
  <text x="699" y="99" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">SYSTEM</text>

  <rect x="933" y="70" width="467" height="46" fill="#8B5CF6"/>
  <text x="1166" y="99" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">FACULTY</text>

  <!-- ============ NODES ============ -->

  <!-- Start -->
  <circle cx="233" cy="160" r="16" fill="#1E2761"/>

  <!-- N1 -->
  <rect x="63" y="200" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="233" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">View Available Mentors</text>
  <text x="233" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">&amp; Focus-Area Match</text>

  <!-- N2 -->
  <rect x="63" y="350" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="233" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Select Time Slot &amp;</text>
  <text x="233" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Submit Booking Request</text>

  <!-- D1 decision -->
  <polygon points="699,325 809,390 699,455 589,390" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/>
  <text x="699" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1E2761">Conflict-Free</text>
  <text x="699" y="401" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1E2761">Slot?</text>

  <!-- N3 -->
  <rect x="529" y="490" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
  <text x="699" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Lock Slot &amp; Create</text>
  <text x="699" y="546" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Booking Record</text>

  <!-- N4 -->
  <rect x="529" y="610" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
  <text x="699" y="644" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Send Confirmation to</text>
  <text x="699" y="666" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Student &amp; Faculty</text>

  <!-- N5 -->
  <rect x="996" y="610" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1166" y="644" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Conduct Mentorship</text>
  <text x="1166" y="666" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Meeting</text>

  <!-- N6 -->
  <rect x="996" y="750" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1166" y="784" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Log Meeting Notes</text>
  <text x="1166" y="806" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">&amp; Session Summary</text>

  <!-- N7 -->
  <rect x="529" y="890" width="340" height="80" rx="14" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
  <text x="699" y="920" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Update Persistent Meeting</text>
  <text x="699" y="942" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Log &amp; Mark Session Complete</text>

  <!-- End -->
  <circle cx="699" cy="1030" r="18" fill="none" stroke="#1E2761" stroke-width="2.5"/>
  <circle cx="699" cy="1030" r="10" fill="#1E2761"/>

  <!-- ============ ARROWS ============ -->

  <!-- Start -> N1 -->
  <line x1="233" y1="176" x2="233" y2="196" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- N1 -> N2 -->
  <line x1="233" y1="280" x2="233" y2="346" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- N2 -> D1 -->
  <line x1="403" y1="390" x2="585" y2="390" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D1 Yes -> N3 -->
  <line x1="699" y1="455" x2="699" y2="486" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="714" y="475" font-size="12.5" font-weight="bold" fill="#0F8A57">Yes</text>

  <!-- D1 No -> loop back to N2 -->
  <path d="M 699 455 L 699 475 L 233 475 L 233 434" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="450" y="469" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B45309">No — choose another slot</text>

  <!-- N3 -> N4 -->
  <line x1="699" y1="570" x2="699" y2="606" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- N4 -> N5 -->
  <line x1="869" y1="650" x2="992" y2="650" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- N5 -> N6 -->
  <line x1="1166" y1="690" x2="1166" y2="746" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- N6 -> N7 (elbow) -->
  <path d="M 996 790 L 699 790 L 699 886" fill="none" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- N7 -> End -->
  <line x1="699" y1="970" x2="699" y2="1008" stroke="#1E2761" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1398" height="1148" fill="none" stroke="#E2E5EC" stroke-width="2"/>
</svg>
